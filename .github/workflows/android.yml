name: Build APK from drop

on:
  push:
    branches: [main, master]
    paths:
      - 'drop/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract newest zip from drop
        run: |
          ZIP=$(ls -t drop/*.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "drop ফোল্ডারে কোনো .zip পাওয়া যায়নি"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf work
          mkdir work
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "জিপের ভেতরে Android প্রজেক্ট (settings.gradle.kts) পাওয়া যায়নি"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(ls -d "$SDK"/cmdline-tools/[0-9]*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)
          if [ -z "$MANAGER" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$MANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > "$PROJECT_DIR/app/google-services.json"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk "dist/NahidEnterprise-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NahidEnterprise-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.apk
